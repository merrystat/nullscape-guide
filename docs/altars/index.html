<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제단 활용법 - Nullscape Visual Guide</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; }
.swiper { height: 384px; }
.swiper-slide { background: white; border-radius: 0.5rem; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; position: relative; box-shadow: 0 10px 15px -3px rgb(0 0 0/.1),0 4px 6px -4px rgb(0 0 0/.1); }
</style>
</head>
<body class="min-h-screen p-8">
  <div class="mx-auto max-w-4xl">
    <header class="mb-8 rounded-3xl border border-slate-200 bg-white p-6 shadow-md">
      <div class="flex items-center gap-6">
        <div class="flex h-24 w-24 items-center justify-center rounded-full bg-slate-900 text-4xl font-black text-white">A</div>
        <div class="flex-1">
          <h1 class="text-2xl font-bold text-slate-900">제단 활용법</h1>
          <p class="mt-1 text-sm text-slate-600">제단 선택과 활용</p>
        </div>
      </div>
    </header>
    <div class="w-full max-w-4xl mx-auto">
      <div class="swiper mySwiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <a href="../" class="absolute right-4 top-4 rounded-full border border-gray-300 bg-white px-3 py-1 text-sm font-semibold text-gray-700 shadow-sm hover:bg-gray-50">메뉴로 돌아가기</a>
            <h2 class="text-2xl font-bold mb-4">제단 활용법 - 소개</h2>
            <p class="text-center">제단은 게임의 핵심 요소입니다. 효과적으로 활용하세요.</p>
          </div>
          <div class="swiper-slide">
            <a href="../" class="absolute right-4 top-4 rounded-full border border-gray-300 bg-white px-3 py-1 text-sm font-semibold text-gray-700 shadow-sm hover:bg-gray-50">메뉴로 돌아가기</a>
            <h2 class="text-2xl font-bold mb-4">제단 선택 기준</h2>
            <p class="text-center">현재 상황에 맞는 버프를 선택. 체력이 낮으면 회복 우선.</p>
          </div>
          <div class="swiper-slide">
            <a href="../" class="absolute right-4 top-4 rounded-full border border-gray-300 bg-white px-3 py-1 text-sm font-semibold text-gray-700 shadow-sm hover:bg-gray-50">메뉴로 돌아가기</a>
            <h2 class="text-2xl font-bold mb-4">활용 팁</h2>
            <p class="text-center">제단은 한 번만 사용할 수 있으니 신중히. 팀원과 협의.</p>
          </div>
          <div class="swiper-slide">
            <a href="../" class="absolute right-4 top-4 rounded-full border border-gray-300 bg-white px-3 py-1 text-sm font-semibold text-gray-700 shadow-sm hover:bg-gray-50">메뉴로 돌아가기</a>
            <h2 class="text-2xl font-bold mb-4">고급 전략</h2>
            <p class="text-center">여러 제단을 조합해 시너지를 내세요.</p>
          </div>
          <div class="swiper-slide">
            <a href="../" class="absolute right-4 top-4 rounded-full border border-gray-300 bg-white px-3 py-1 text-sm font-semibold text-gray-700 shadow-sm hover:bg-gray-50">메뉴로 돌아가기</a>
            <h2 class="text-2xl font-bold mb-4">결론</h2>
            <p class="text-center">제단을 전략적으로 사용하면 승률이 올라갑니다.</p>
          </div>
        </div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-pagination"></div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    new Swiper('.mySwiper', {
      navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
      pagination: { el: '.swiper-pagination', clickable: true },
    });
  </script>
</body>
</html>
